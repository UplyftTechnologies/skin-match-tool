<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #fff9f2; color: #171417; font-family: -apple-system, system-ui, sans-serif; text-align: center; }
    main { padding: 24px; max-width: 320px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #5c5560; margin: 0 0 24px; }
    button { background: #c255a8; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Match My Skin needs an internet connection to find your matches.</p>

  </main>
</body>
</html>
