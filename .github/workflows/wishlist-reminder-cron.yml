name: Wishlist reminder cron

# Pings the deployed site every 5 minutes so it can send the "cart is
# waiting" push notification to anyone whose 15-minute wishlist reminder is
# due. Requires two repo secrets (Settings > Secrets and variables >
# Actions):
#   SITE_URL     e.g. https://mymatches.roopsee.com
#   CRON_SECRET  must match the CRON_SECRET env var set on the deployment
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder send
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/send-wishlist-reminders"
