<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebOTP fix test</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  #status { white-space: pre-wrap; background: #f3f3f3; padding: 10px; border-radius: 6px; font-size: 13px; min-height: 120px; }
  .boxes { display: flex; gap: 6px; margin: 16px 0; }
  .boxes input { width: 40px; height: 48px; text-align: center; font-size: 20px; }
</style>
</head>
<body>
  <h3>WebOTP autofill fix test</h3>
  <div class="boxes" id="paste-wrap">
    <input maxlength="6" autocomplete="one-time-code" name="otp" inputmode="numeric" data-idx="0" />
    <input maxlength="6" autocomplete="off" inputmode="numeric" data-idx="1" />
    <input maxlength="6" autocomplete="off" inputmode="numeric" data-idx="2" />
    <input maxlength="6" autocomplete="off" inputmode="numeric" data-idx="3" />
    <input maxlength="6" autocomplete="off" inputmode="numeric" data-idx="4" />
    <input maxlength="6" autocomplete="off" inputmode="numeric" data-idx="5" />
  </div>
  <div id="status">booting…</div>

<script>
  const boxes = Array.from(document.querySelectorAll('.boxes input'));
  const statusEl = document.getElementById('status');
  let otp = ['', '', '', '', '', ''];

  function log(line) {
    statusEl.textContent += '\n' + line;
    console.log('[TEST]', line);
  }

  function render() {
    boxes.forEach((box, i) => { box.value = otp[i]; });
  }

  // Exact port of the fixed handleOtpChange from src/hooks/use-otp-auth.js
  function handleOtpChange(index, value) {
    const digitsOnly = value.replace(/\D/g, '');

    if (digitsOnly.length > 1) {
      log('onChange fired on box ' + index + ' with MULTI-CHAR value: "' + value + '" (len ' + digitsOnly.length + ')');
      const newOtp = [...otp];
      let cursor = index;
      for (const digit of digitsOnly) {
        if (cursor > 5) break;
        newOtp[cursor] = digit;
        cursor += 1;
      }
      otp = newOtp;
      render();
      const fullCode = newOtp.join('');
      log('after redistribution: otp=' + JSON.stringify(newOtp) + ' fullCode="' + fullCode + '"');
      if (fullCode.length === 6) {
        log('✅ WOULD AUTO-SUBMIT with code: ' + fullCode);
      }
      return;
    }

    const newOtp = [...otp];
    newOtp[index] = digitsOnly;
    otp = newOtp;
    render();
  }

  boxes.forEach((box) => {
    box.addEventListener('input', (e) => handleOtpChange(Number(box.dataset.idx), e.target.value));
  });

  document.getElementById('paste-wrap').addEventListener('paste', (e) => {
    e.preventDefault();
    const pasteData = e.clipboardData.getData('text').trim().replace(/\D/g, '');
    log('native paste event fired: "' + pasteData + '"');
  });

  log('origin: ' + window.location.origin);
  log('OTPCredential in window: ' + ('OTPCredential' in window));

  if (!('OTPCredential' in window)) {
    log('WebOTP not supported on this browser.');
  } else {
    log('Calling navigator.credentials.get({otp:{transport:["sms"]}}) — waiting for a matching SMS…');
    navigator.credentials.get({ otp: { transport: ['sms'] } })
      .then((cred) => {
        log('✅ navigator.credentials.get RESOLVED. cred=' + JSON.stringify(cred));
        if (cred && cred.code) {
          log('cred.code = "' + cred.code + '"');
          // Simulate the browser inserting the code into box 0, same as a real device does.
          boxes[0].value = cred.code;
          boxes[0].dispatchEvent(new Event('input', { bubbles: true }));
        } else {
          log('❌ cred had no .code property');
        }
      })
      .catch((err) => {
        log('❌ navigator.credentials.get REJECTED: ' + err.name + ': ' + err.message);
      });
  }
</script>
</body>
</html>
