services:
  - type: web
    # Must match the service name in the Render dashboard, otherwise applying
    # this blueprint creates a second service alongside the running one.
    name: skin-match-tool
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # The only hostname that actually resolves. This feeds metadataBase,
      # every canonical tag, the sitemap and all JSON-LD urls, so it has to be
      # the live origin.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://roopsee.com
      - key: TELEGRAM_EVENT_BOT_TOKEN
        sync: false
      - key: TELEGRAM_EVENT_CHAT_ID
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Shared with the GitHub Actions workflow that sweeps due reminders —
      # see .github/workflows/wishlist-reminders.yml
      - key: CRON_SECRET
        sync: false

  # Optional companion service for hosts that cannot execute Python directly
  # (Vercel, primarily — see PRICE_REFRESH.md). Exposes /refresh (price) and
  # /delivery-check over HTTP; set PRICE_SCRAPER_URL / DELIVERY_CHECK_URL on
  # the Next.js host to point at this service's routes once it's deployed.
  - type: web
    name: skin-match-tool-price-scraper
    runtime: python
    plan: starter
    buildCommand: pip install -r scripts/price-scraper-requirements.txt && scrapling install
    startCommand: uvicorn price_scraper_service:app --app-dir scripts --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PRICE_SCRAPER_TOKEN
        sync: false
      - key: DELIVERY_CHECK_TOKEN
        sync: false
